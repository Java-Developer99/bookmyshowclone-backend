server:
  port: 8083

spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: theater-service-group
      auto-offset-reset: earliest
  datasource:
    url: jdbc:mysql://localhost:3306/theater_service
    username: root
    password: Springboot@1
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
      dialect: org.hibernate.dialect.MySQL8Dialect
      format_sql: true
      show_sql: true

  application:
    name: THEATER-SERVICE

  config:
    import: optional:configserver:http://localhost:8085

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always


