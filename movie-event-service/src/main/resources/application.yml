server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/movie_event_service
    username: root
    password: Springboot@1
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
      dialect: org.hibernate.dialect.MySQL8Dialect
      format_sql: true
      show_sql: true

  application:
    name: MOVIE-SERVICE

  config:
    import: optional:configserver:http://localhost:8085


zipkin:
  base-url: http://localhost:9411
  sleuth:
    sampler:
      probability: 1.0

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html


